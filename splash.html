    <style>
        .glass-panel {
            background-color: rgba(43, 40, 48, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);

<body
    class="bg-deep-charcoal text-on-surface antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden font-body-md text-body-md">
    <!-- Ambient Background Glows -->
    <div class="absolute inset-0 z-0 pointer-events-none">
        <div class="absolute -top-[20%] -left-[20%] w-[140%] h-[140%] bg-glow-radial blur-[80px]"></div>
        <div class="absolute bottom-0 left-0 w-full h-[50%] bg-gradient-to-t from-deep-charcoal to-transparent z-10">
        </div>
    </div>
    <!-- Main Content Container -->
    <main
        class="relative z-20 w-full max-w-md px-margin-mobile flex flex-col items-center text-center h-full min-h-screen justify-between py-12">
        <!-- Top Section: Brand Pill -->
        <div class="w-full flex justify-center mt-8">
            <div class="glass-panel rounded-full px-6 py-2 inline-flex items-center gap-2">
                <span class="text-primary font-label-sm text-label-sm uppercase tracking-wider">✨ Aura AI
                    Workspace</span>
            </div>
        </div>
        <!-- Middle Section: 3D Orb & Typography -->
        <div class="w-full flex flex-col items-center justify-center flex-grow gap-stack-md my-stack-lg">
            <!-- Frosted 3D Glass Orb Visualization (Placeholder) -->
            <div class="relative w-48 h-48 mb-8 flex items-center justify-center">
                <!-- Ambient glow behind orb -->
                <div class="absolute inset-0 bg-primary/20 blur-3xl rounded-full"></div>
                <div
                    class="w-full h-full rounded-full glass-panel flex items-center justify-center relative overflow-hidden shadow-[0_0_40px_rgba(192,108,132,0.15)]">
                    <span class="material-symbols-outlined text-6xl text-primary opacity-80"
                        style="font-variation-settings: 'FILL' 1;">
                        auto_awesome
                    </span>
                    <!-- Highlight to simulate glass reflection -->
                    <div class="absolute top-0 left-1/4 w-1/2 h-1/4 bg-white/10 rounded-full blur-md"></div>
                </div>
            </div>
            <!-- Headline -->
            <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface max-w-[300px]">
                Your aesthetic <br />
                <span class="font-headline-lg-mobile text-headline-lg-mobile italic text-primary">intelligent</span>
                <br />
                companion
            </h1>
            <!-- Subtitle -->
            <p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
                Experience seamless, gentle, and highly responsive AI assistance crafted for elegance and everyday
                productivity.
            </p>
        </div>
        <!-- Bottom Section: CTA -->
        <div class="w-full pb-8">
            <button
                class="w-full py-4 rounded-full bg-gradient-to-r from-[#C06C84] to-[#D49B9B] text-off-white font-label-md text-label-md flex items-center justify-center gap-2 shadow-[0_0_30px_rgba(192,108,132,0.25)] hover:shadow-[0_0_40px_rgba(192,108,132,0.4)] transition-all duration-300" ><a href="auth.html">
