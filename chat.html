<style>
        body {
            background-color: #1A181E; /* deep-charcoal */
            background-image: radial-gradient(circle at 100% 0%, rgba(192, 108, 132, 0.08) 0%, transparent 50%),
                              radial-gradient(circle at 0% 100%, rgba(192, 108, 132, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
            overscroll-behavior-y: none;
        }

        /* Ambient Glow Utilities */
        .ambient-glow {
            box-shadow: 0 0 40px 0 rgba(192, 108, 132, 0.15); /* rose-gold-glow */
        }

        .glass-panel {
            background-color: rgba(43, 40, 48, 0.4); /* midnight-pearl 40% */
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .glass-panel-heavy {
            background-color: rgba(43, 40, 48, 0.7); /* midnight-pearl 70% */
            backdrop-filter: blur(32px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Custom Scrollbar for Chat Area */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        /* Input field focus transition */
        .chat-input:focus-within {
            border-color: #ffb1c5; /* primary */
            box-shadow: 0 0 20px 0 rgba(192, 108, 132, 0.2);
        }
        
        .chat-input {
            transition: all 0.3s ease;
        }

        /* Hide scrollbar for the layout container but allow scrolling */
        .hide-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .typing-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: #ffb1c5; opacity: .5;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .typing-dot:nth-child(2) { animation-delay: .15s; }
        .typing-dot:nth-child(3) { animation-delay: .3s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: .5; }
            30% { transform: translateY(-4px); opacity: 1; }
        }

        /* Markdown rendering inside AI bubbles */
        .markdown-body { font-size: 15px; line-height: 1.65; }
        .markdown-body p { margin-bottom: 10px; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body strong { font-weight: 700; color: #ffffff; }
        .markdown-body em { font-style: italic; }
        .markdown-body ul, .markdown-body ol { margin: 8px 0 12px 22px; }
        .markdown-body ul { list-style: disc; }
        .markdown-body ol { list-style: decimal; }
        .markdown-body li { margin-bottom: 6px; }
        .markdown-body li > ul, .markdown-body li > ol { margin-top: 6px; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            margin: 14px 0 8px;
            color: #ffffff;
        }
        .markdown-body h1 { font-size: 21px; }
        .markdown-body h2 { font-size: 18px; }
        .markdown-body h3 { font-size: 16px; }
        .markdown-body code {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(255, 177, 197, 0.12);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13.5px;
        }
        .markdown-body pre {
            background: #0f0d13;
            color: #e6e0e9;
            padding: 14px 16px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 10px 0;
        }
        .markdown-body pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }
        .markdown-body a { color: #ffb1c5; text-decoration: underline; }
        .markdown-body blockquote {
            border-left: 3px solid #cd778f;
            padding-left: 12px;
            margin: 10px 0;
            color: #d8c1c5;
            font-style: italic;

<!-- ==================== BACKEND INTEGRATION SCRIPT ==================== -->
<script>
    const API_BASE = "http://127.0.0.1:5000"; // your Flask backend

    const chatStream = document.getElementById("chatStream");
    const chatInput  = document.getElementById("chatInput");
    const sendBtn    = document.getElementById("sendBtn");
    const newChatBtn = document.getElementById("newChatBtn");
    const menuBtn    = document.getElementById("menuBtn");
    const sidebar    = document.getElementById("sidebar");
    const sidebarOverlay = document.getElementById("sidebarOverlay");
    const sidebarNewChatBtn = document.getElementById("sidebarNewChatBtn");

    function openSidebar() {
        sidebar.classList.remove("-translate-x-full");
        sidebarOverlay.classList.remove("opacity-0", "pointer-events-none");
    }

    function closeSidebar() {
        sidebar.classList.add("-translate-x-full");
        sidebarOverlay.classList.add("opacity-0", "pointer-events-none");
    }

    menuBtn.addEventListener("click", openSidebar);
    sidebarOverlay.addEventListener("click", closeSidebar);

    function scrollToBottom() {
        chatStream.scrollTop = chatStream.scrollHeight;
    }

    function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
    }

    function renderMarkdown(text) {
        if (window.marked) {
            return marked.parse(text);
        }
        return escapeHtml(text);
    }

    function addUserMessage(text) {
        const row = document.createElement("div");
        row.className = "flex flex-col gap-1 max-w-[85%] self-end";
        row.style.animation = "fadeIn 0.3s ease-out";
        row.innerHTML = `
            <div class="bg-gradient-to-r from-primary-container to-[#D49B9B] p-4 rounded-2xl rounded-tr-sm w-full font-body-md text-body-md text-on-primary-container shadow-md shadow-rose-gold-glow">
                <p>${escapeHtml(text)}</p>
            </div>`;
        chatStream.appendChild(row);
        scrollToBottom();
    }

    function addAiMessage(text) {
        const row = document.createElement("div");
        row.className = "flex flex-col gap-2 max-w-[90%] self-start";
        row.style.animation = "fadeIn 0.4s ease-out";
        row.innerHTML = `
            <div class="flex items-center gap-2 mb-1">
                <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-primary-container to-surface-tint flex items-center justify-center shadow-lg shadow-rose-gold-glow">
                    <span class="material-symbols-outlined text-on-primary-container text-[14px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
                </div>
                <span class="font-label-sm text-label-sm text-on-surface-variant">Aura</span>
            </div>
            <div class="glass-panel p-4 rounded-2xl rounded-tl-sm w-full text-on-surface leading-relaxed shadow-sm markdown-body">
                ${renderMarkdown(text)}
            </div>`;
        chatStream.appendChild(row);
        scrollToBottom();
    }

    function showTyping() {
        const row = document.createElement("div");
        row.className = "flex flex-col gap-2 max-w-[60%] self-start";
        row.id = "typingRow";
        row.innerHTML = `
            <div class="glass-panel px-4 py-3 rounded-2xl rounded-tl-sm flex items-center gap-1.5 w-fit">
                <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
            </div>`;
        chatStream.appendChild(row);
        scrollToBottom();
    }

    function hideTyping() {
        const row = document.getElementById("typingRow");
        if (row) row.remove();
    }

    async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        addUserMessage(text);
        chatInput.value = "";
        showTyping();

        try {
            const res = await fetch(`${API_BASE}/api/chat`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({ message: text })
            });

            const data = await res.json();
            hideTyping();

            if (data.error) {
                addAiMessage("Something went wrong: " + data.error);
            } else {
                addAiMessage(data.reply);
            }
        } catch (err) {
            hideTyping();
            addAiMessage("Couldn't reach the server. Is app.py running on port 5000?");
        }
    }

    sendBtn.addEventListener("click", sendMessage);

    chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            sendMessage();
        }
    });

    if (newChatBtn) {
        newChatBtn.addEventListener("click", async () => {
            try {
                await fetch(`${API_BASE}/api/new-chat`, { method: "POST", credentials: "include" });
            } catch (err) {
                // backend might not be running yet; ignore
            }
            chatStream.innerHTML = "";
            addAiMessage("New chat started. What's on your mind?");
        });
    }

    if (sidebarNewChatBtn) {
        sidebarNewChatBtn.addEventListener("click", () => {
            closeSidebar();
            newChatBtn.click();
        });
    }
</script>
