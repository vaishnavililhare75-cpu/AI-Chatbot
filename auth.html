<style>

            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);

            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

            border-color: #ffb1c5; /* primary */
            box-shadow: 0 0 15px rgba(255, 177, 197, 0.1);
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }

<!-- SUPPRESSING NAVIGATION SHELL: Transactional Login Intent -->
<main class="w-full max-w-[1024px] mx-auto">
<!-- Dual Panel Card -->
<div class="glass-panel ambient-shadow rounded-[28px] overflow-hidden flex flex-col md:flex-row relative z-10">
<!-- Left Brand Panel -->

                        Aura AI
                    </h1>
</div>
<div class="relative z-10 mt-stack-lg md:mt-0">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg mb-stack-sm text-off-white">
                        Welcome to your calm workspace
                    </h2>
<p class="font-body-lg text-body-lg text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">lock</span>
                        Protected by Passkey &amp; Biometric Encrypted Auth
                    </p>
</div>
</div>
<!-- Right Form Container -->
<div class="w-full md:w-7/12 p-stack-lg bg-surface-container/60 backdrop-blur-2xl">
<!-- Pill Tab Selector -->
<div class="flex p-1 bg-surface-container-high rounded-full mb-stack-lg border border-outline-variant/30">
<button class="flex-1 py-2 font-label-md text-label-md rounded-full bg-surface-bright text-primary ambient-shadow transition-all duration-300">Sign In</button>
<button class="flex-1 py-2 font-label-md text-label-md rounded-full text-on-surface-variant hover:bg-white/10 transition-all duration-300">Register</button>
</div>
<form class="space-y-stack-md">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-base" for="email">Email Address</label>
<input class="glass-input w-full rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50" id="email" placeholder="name@company.com" type="email"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-base" for="password">Password</label>
<input class="glass-input w-full rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50" id="password" placeholder="••••••••" type="password"/>
</div>
<div class="flex items-center justify-between">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="rounded border-outline-variant bg-surface-container-high text-primary focus:ring-primary group-hover:bg-white/10 transition-colors" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant">Remember me</span>
</label>
<a class="font-label-md text-label-md text-[#C06C84] hover:text-primary transition-colors" href="#">Forgot password?</a>
</div>
<button class="w-full py-4 rounded-full font-label-md text-label-md text-white bg-gradient-to-r from-[#C06C84] to-[#D49B9B] hover:opacity-90 transition-opacity ambient-shadow mt-stack-sm" type="button">
                        Sign In to Workspace
                    </button>
</form>
<!-- Social Auth -->
<div class="mt-stack-lg">
<div class="flex items-center gap-4 mb-stack-md">
<div class="flex-1 h-px bg-outline-variant/30"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Or continue with</span>
<div class="flex-1 h-px bg-outline-variant/30"></div>
</div>
<div class="flex justify-center gap-4">
<button class="p-3 glass-panel rounded-full hover:bg-white/10 transition-all duration-300 flex items-center justify-center ambient-shadow group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">login</span>
</button>
<button class="p-3 glass-panel rounded-full hover:bg-white/10 transition-all duration-300 flex items-center justify-center ambient-shadow group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">file_download</span>
</button>
<button class="p-3 glass-panel rounded-full hover:bg-white/10 transition-all duration-300 flex items-center justify-center ambient-shadow group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">fingerprint</span>
</button>

</div>
